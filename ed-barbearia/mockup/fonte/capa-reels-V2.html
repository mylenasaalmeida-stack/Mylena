<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Anton;src:url('../../marca/fonte/fonts/Anton.ttf')}
@font-face{font-family:Inter;font-weight:400;src:url('../../marca/fonte/fonts/Inter-400.ttf')}
@font-face{font-family:Inter;font-weight:600;src:url('../../marca/fonte/fonts/Inter-600.ttf')}
@font-face{font-family:Inter;font-weight:700;src:url('../../marca/fonte/fonts/Inter-700.ttf')}
@font-face{font-family:Poppins;font-weight:600;src:url('../../../fonte/fonts/Poppins-600.woff2')}
@font-face{font-family:Poppins;font-weight:700;src:url('../../../fonte/fonts/Poppins-700.woff2')}

*{margin:0;padding:0;box-sizing:border-box}
.c{width:1080px;height:1920px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:0 100px}
.c .t{font-family:Anton;text-transform:uppercase;font-size:200px;line-height:.92;position:relative;z-index:2}
.c .l{font-family:Poppins;font-weight:700;font-size:34px;letter-spacing:.24em;position:relative;z-index:2;margin-bottom:30px}
.c .nv{position:relative;z-index:2;margin-top:50px}

.x{display:grid;grid-template-columns:110px 1fr;gap:0 26px;align-items:center;margin-bottom:26px;position:relative;z-index:2}
.x .n{width:110px;height:110px;border-radius:50%;background:#111111;color:#FFC629;font-family:Anton;font-size:70px;display:flex;align-items:center;justify-content:center;position:relative}
.x .n:after{content:'';position:absolute;inset:-6px;background:linear-gradient(45deg,transparent 46%,#e8473c 46%,#e8473c 54%,transparent 54%)}
.x b{font-family:Anton;font-weight:400;font-size:62px;line-height:1;text-transform:uppercase}
</style></head><body><section class="c" style="background:#FFC629;color:#111111">
<div class="l">ED BARBEARIA</div>
<div class="t" style="font-size:140px;line-height:.95">3 coisas que<br>estragam teu<br>corte em 3 dias</div>
<div style="margin-top:60px">
<div class="x"><div class="n">1</div><b>Pezinho em casa</b></div>
<div class="x"><div class="n">2</div><b>Dormir molhado</b></div>
<div class="x"><div class="n">3</div><b>Pomada demais</b></div></div></section></body></html>

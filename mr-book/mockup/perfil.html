<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Mockup do perfil · Mr.Book</title>
<style>
/* Tela de iPhone 390×844 (exporta em 3x = 1170×2532), Instagram em modo escuro */
:root{--bg:#000;--fg:#F5F5F5;--mut:#A8A8A8;--btn:#262626;--blue:#0095F6;--link:#E0F1FF;--amarelo:#FFCE1B;--grafite:#16181D}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#555;display:flex;gap:40px;padding:40px;align-items:flex-start;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.screen{width:390px;height:844px;background:var(--bg);color:var(--fg);overflow:hidden;position:relative;flex:none}
.status{height:54px;display:flex;justify-content:space-between;align-items:center;padding:14px 30px 0 34px;font-size:16px;font-weight:600}
.status .r{display:flex;gap:6px;align-items:center}
.nav{height:44px;display:flex;align-items:center;gap:14px;padding:0 14px;font-size:21px;font-weight:700}
.nav .sp{flex:1}
.prof{display:grid;grid-template-columns:88px 1fr;gap:16px;align-items:center;padding:6px 16px 0}
.av{width:88px;height:88px;border-radius:50%;padding:3px;background:conic-gradient(from 210deg,#FEDA75,#FA7E1E,#D62976,#962FBF,#4F5BD5,#FEDA75)}
.av div{width:100%;height:100%;border-radius:50%;border:3px solid #000;overflow:hidden;background:var(--amarelo)}
.av img{width:100%;height:100%;object-fit:cover}
.name{font-size:15px;font-weight:600;line-height:1.25;margin-bottom:8px}
.stats{display:flex;gap:22px;font-size:14px;line-height:1.2}
.stats b{display:block;font-size:17px;font-weight:700}
.bio{padding:12px 16px 0;font-size:14.5px;line-height:1.36}
.bio .cat{color:var(--mut)}
.bio .lnk{display:flex;gap:6px;align-items:center;color:var(--link);font-weight:600;margin-top:2px}
.bio .addr{color:var(--fg);margin-top:2px;display:flex;gap:6px;align-items:center}
.btns{display:grid;grid-template-columns:1fr 1fr 1fr 34px;gap:6px;padding:14px 16px 4px}
.btns span{background:var(--btn);border-radius:8px;text-align:center;font-size:14px;font-weight:600;padding:7px 0;display:flex;justify-content:center;align-items:center}
.btns .follow{background:var(--blue);color:#fff}
.hls{display:flex;gap:16px;padding:14px 16px 12px;overflow:hidden}
.hl{display:grid;justify-items:center;gap:6px;width:66px;flex:none}
.hl .ring{width:66px;height:66px;border-radius:50%;border:1px solid #3a3a3a;display:grid;place-items:center}
.hl .cov{width:58px;height:58px;border-radius:50%;background:var(--amarelo);color:var(--grafite);display:grid;place-items:center}
.hl .cov svg{width:28px;height:28px}
.hl small{font-size:12px;white-space:nowrap;max-width:70px;overflow:hidden;text-overflow:ellipsis}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid #262626}
.tabs span{display:grid;place-items:center;height:44px;color:var(--mut)}
.tabs span:first-child{color:#fff;box-shadow:inset 0 -1.5px 0 #fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.grid .c{aspect-ratio:3/4;position:relative;overflow:hidden;background:#111}
.grid .c img{width:100%;height:100%;object-fit:cover;display:block}
.grid .c svg{position:absolute;top:6px;right:6px;width:16px;height:16px;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;background:#000;border-top:1px solid #1c1c1c;display:flex;justify-content:space-around;padding-top:12px}
.tabbar svg{width:26px;height:26px;color:#fff}
.tabbar .me{width:28px;height:28px;border-radius:50%;overflow:hidden;border:1.5px solid #fff}
.tabbar .me img{width:100%;height:100%}
.home{position:absolute;left:50%;bottom:8px;width:134px;height:5px;border-radius:3px;background:#fff;transform:translateX(-50%)}
.scrolled .head{height:98px}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="h-kit" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="7.5" width="18" height="12.5" rx="2.5"/><path d="M8.5 7.5V5.5a1.5 1.5 0 0 1 1.5-1.5h4a1.5 1.5 0 0 1 1.5 1.5v2"/><path d="M12 10.8v5.4M9.3 13.5h5.4" stroke-linecap="round"/></g></symbol>
<symbol id="h-esteto" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 3v5a4 4 0 0 0 8 0V3"/><path d="M9 12v2.5a5 5 0 0 0 10 0V12"/></g><circle cx="19" cy="10" r="2.4" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
<symbol id="h-curso" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c2 2 10 2 12 0v-5"/><path d="M22 9v6"/></g></symbol>
<symbol id="h-livro" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 4.5h11a3 3 0 0 1 3 3V20H7a3 3 0 0 1-3-3z"/><path d="M4 17a3 3 0 0 1 3-3h11"/><path d="M8 8h6" stroke-linecap="round"/></g></symbol>
<symbol id="h-clientes" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H10l-4 3.5V16H4z"/><path d="M12 13.2l-2.6-2.5a1.6 1.6 0 0 1 2.6-1.9 1.6 1.6 0 0 1 2.6 1.9z" fill="currentColor" stroke-width="1"/></g></symbol>
<symbol id="h-comprar" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.5l2.2 10.5h10L20 7.5H6.3"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></g></symbol>
<symbol id="h-loja" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></g></symbol>
<symbol id="h-turma" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><circle cx="16.5" cy="9" r="2.5"/><path d="M2.5 19a5.5 5.5 0 0 1 11 0M13.5 15.2a4.5 4.5 0 0 1 8 3.8"/></g></symbol>
<symbol id="pin" viewBox="0 0 24 24"><path fill="currentColor" d="M15.5 2.5l6 6-2.2.7-3.6 3.6.4 4.1-1.7 1.7-4.2-4.2-5.4 5.4-1.3-1.3 5.4-5.4-4.2-4.2 1.7-1.7 4.1.4 3.6-3.6z"/></symbol>
<symbol id="car" viewBox="0 0 24 24"><rect x="6.5" y="2.5" width="15" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 7v12a2 2 0 0 0 2 2h12" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
<symbol id="link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
<symbol id="pinmap" viewBox="0 0 24 24"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="10" r="2.4" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
</defs></svg>
<div id="out"></div>
<script>
const E='../export/';
const AV=E+'perfil/foto-de-perfil.png';
const GRID=[
 ['fixados/fixado-1-quem-somos','pin'],['fixados/fixado-2-kits-por-curso','pin'],['fixados/fixado-3-como-comprar','pin'],
 ['feed/post-produto-bic-eternity-rainbow',''],['feed/carrossel-qual-esteto/01','car'],['feed/post-foto-primeiro-plantao',''],
 ['feed/post-produto-kit-enfermagem',''],['feed/carrossel-1o-estagio/01','car'],['feed/post-foto-turma',''],
 ['feed/post-produto-oximetro',''],['feed/carrossel-linhas/01','car'],['feed/post-produto-rappaport',''],
 ['feed/post-livros-de-bolso',''],['feed/post-foto-estudo',''],['feed/post-produto-esfigmo','']];
const HL=[['h-kit','Monte seu kit'],['h-esteto','Estetos'],['h-curso','Por curso'],['h-turma','Turmas'],['h-clientes','Clientes'],['h-comprar','Como comprar'],['h-livro','Livros'],['h-loja','A loja']];
const status=`<div class="status"><span>9:41</span><span class="r"><svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#fff"/><rect x="5" y="5" width="3" height="7" rx="1" fill="#fff"/><rect x="10" y="2.5" width="3" height="9.5" rx="1" fill="#fff"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#fff"/></svg><svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5l2.3-2.6a3.3 3.3 0 0 0-4.6 0zM3.4 6.6a6.6 6.6 0 0 1 9.2 0l1.4-1.6a8.8 8.8 0 0 0-12 0zM.5 3.3a10.9 10.9 0 0 1 15 0L16 2.7A12.6 12.6 0 0 0 0 2.7z" fill="#fff"/></svg><svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#fff" opacity=".5"/><rect x="2" y="2" width="17" height="9" rx="2" fill="#fff"/><rect x="24.5" y="4.5" width="1.6" height="4" rx=".8" fill="#fff" opacity=".5"/></svg></span></div>`;
const nav=`<div class="nav"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M15 4l-8 8 8 8"/></svg><span>mrbookessencial</span><span class="sp"></span><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 7H4c0-1 2-2 2-7zM10 19.5a2 2 0 0 0 4 0"/></svg><svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></div>`;
const grid=(items)=>`<div class="grid">${items.map(([f,i])=>`<div class="c"><img src="${E+f}.png">${i?`<svg><use href="#${i}"/></svg>`:''}</div>`).join('')}</div>`;
const tabs=`<div class="tabs"><span><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="5" height="5"/><rect x="9.5" y="3" width="5" height="5"/><rect x="16" y="3" width="5" height="5"/><rect x="3" y="9.5" width="5" height="5"/><rect x="9.5" y="9.5" width="5" height="5"/><rect x="16" y="9.5" width="5" height="5"/><rect x="3" y="16" width="5" height="5"/><rect x="9.5" y="16" width="5" height="5"/><rect x="16" y="16" width="5" height="5"/></svg></span><span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2.5" y="2.5" width="19" height="19" rx="5"/><path d="M10 8.2v7.6l6-3.8z" fill="currentColor"/></svg></span><span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9h13l-3-3M20 15H7l3 3"/></svg></span><span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="12" cy="11" r="3"/><path d="M7 20a5 5 0 0 1 10 0"/></svg></span></div>`;
const tabbar=`<div class="tabbar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5L12 3l9 7.5V21h-6v-6H9v6H3z"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2.5" y="2.5" width="19" height="19" rx="5"/><path d="M10 8.2v7.6l6-3.8z" fill="currentColor"/></svg><span class="me"><img src="${AV}"></span></div><div class="home"></div>`;
const BIO=`🩺 Equipando quem estuda saúde há 20 anos<br>Estetos, kits por curso e livros técnicos<br>📦 Recife e todo o Brasil · 4x sem juros<br>👇 Monte seu kit aqui`;
const tela1=`<div class="screen" data-out="mockup-perfil-instagram">${status}${nav}
 <div class="prof"><div class="av"><div><img src="${AV}"></div></div><div><div class="name">Mr.Book · Estetoscópios e Kits de Saúde</div><div class="stats"><span><b>371</b>posts</span><span><b>5.946</b>seguidores</span><span><b>812</b>seguindo</span></div></div></div>
 <div class="bio"><div class="cat">Artigos médicos</div><div>${BIO}</div>
  <div class="lnk"><svg width="15" height="15"><use href="#link"/></svg>mrbook.com.br/kit e mais 1</div>
  <div class="addr"><svg width="14" height="14"><use href="#pinmap"/></svg>R. Santa Edwirges, 456, Afogados, Recife</div></div>
 <div class="btns"><span class="follow">Seguir</span><span>Mensagem</span><span>WhatsApp</span><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M19 8v6M16 11h6"/></svg></span></div>
 <div class="hls">${HL.map(([i,n])=>`<div class="hl"><span class="ring"><span class="cov"><svg><use href="#${i}"/></svg></span></span><small>${n}</small></div>`).join('')}</div>
 ${tabs}${grid(GRID)}${tabbar}</div>`;
const tela2=`<div class="screen scrolled" data-out="mockup-perfil-instagram-grade">${status}${nav}${tabs}${grid(GRID)}${tabbar}</div>`;
document.getElementById('out').innerHTML=tela1+tela2;
</script></body></html>
